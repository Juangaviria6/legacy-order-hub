name: CI

on:
  push:
    branches: [main, Dev]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, SAST y pruebas
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Generar clave efimera de Django
        run: echo "DJANGO_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Estilo (black)
        run: black --check .
      - name: Linter (flake8)
        run: flake8 .
      - name: SAST (bandit)
        run: bandit -r apps common config -c pyproject.toml
      - name: Pruebas con cobertura minima del 80%
        run: |
          coverage run manage.py test
          coverage report --fail-under=80

  docker:
    name: Build de imagen y prueba de humo
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: orderhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen (instala las dependencias de produccion)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: legacy-order-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prueba de humo del contenedor contra PostgreSQL
        run: |
          docker run -d --name app --network host \
            -e DJANGO_SECRET_KEY="$(openssl rand -hex 32)" \
            -e DJANGO_DEBUG=False \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DATABASE_URL=postgres://postgres@localhost:5432/orderhub \
            legacy-order-hub:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/healthcheck && break
            sleep 2
          done
          curl -fs http://localhost:8000/healthcheck
          curl -fs http://localhost:8000/products
          curl -fs http://localhost:8000/metrics | grep -q django_http
          curl -fs -X POST http://localhost:8000/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"juan","password":"123456"}' | grep -q access
      - name: Logs del contenedor si falla
        if: failure()
        run: docker logs app

  manifests:
    name: Validar manifiestos de Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
      - name: Validar k8s/
        run: |
          for d in k8s k8s/monitoring k8s/canary; do
            kubectl kustomize "$d" | ./kubeconform -strict -summary -ignore-missing-schemas
          done
