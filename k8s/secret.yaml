# PLANTILLA: los valores son marcadores. NO suba credenciales reales al repositorio.
# Cree el Secret real con:
#   kubectl -n orderhub create secret generic orderhub-secret \
#     --from-literal=DJANGO_SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(50))')" \
#     --from-literal=POSTGRES_PASSWORD="<password>" \
#     --from-literal=DATABASE_URL="postgres://orderhub:<password>@postgres:5432/orderhub" \
#     --from-literal=GRAFANA_ADMIN_PASSWORD="<password>"
apiVersion: v1
kind: Secret
metadata:
  name: orderhub-secret
  namespace: orderhub
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "CAMBIAR-por-una-clave-de-mas-de-32-caracteres"
  POSTGRES_PASSWORD: "CAMBIAR"
  DATABASE_URL: "postgres://orderhub:CAMBIAR@postgres:5432/orderhub"
  GRAFANA_ADMIN_PASSWORD: "CAMBIAR"
