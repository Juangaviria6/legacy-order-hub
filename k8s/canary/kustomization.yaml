apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment-canary.yaml
  - ingress.yaml
  - rollback-cronjob.yaml
configMapGenerator:
  - name: canary-guard-script
    namespace: orderhub
    files:
      - canary_check.sh
generatorOptions:
  disableNameSuffixHash: true
