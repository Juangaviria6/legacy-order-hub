# Versión candidata. Actualice la imagen (p. ej. legacy-order-hub:v2) y aplique.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderhub-canary
  namespace: orderhub
  labels:
    app: orderhub-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderhub-canary
  template:
    metadata:
      labels:
        app: orderhub-canary
        version: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: orderhub
          image: legacy-order-hub:canary
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: orderhub-config
            - secretRef:
                name: orderhub-secret
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /healthcheck, port: http }
            initialDelaySeconds: 20
          readinessProbe:
            httpGet: { path: /healthcheck, port: http }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orderhub-canary
  namespace: orderhub
spec:
  selector:
    app: orderhub-canary
  ports:
    - name: http
      port: 80
      targetPort: http
