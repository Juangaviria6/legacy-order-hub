apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orderhub
  namespace: orderhub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orderhub
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
