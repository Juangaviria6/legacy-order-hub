# Blueprint de Render: web service (Docker) + PostgreSQL gestionado.
# CD: Render solo despliega cuando los checks de GitHub Actions (CI) pasan.
databases:
  - name: orderhub-db
    databaseName: orderhub
    user: orderhub
    plan: free
    ipAllowList: [] # solo accesible desde servicios de Render (red privada)

services:
  - type: web
    name: legacy-order-hub
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthcheck
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: "8000"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Contrasenas iniciales de los usuarios admin y juan (visibles en el panel de Render).
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_USER_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: orderhub-db
          property: connectionString
