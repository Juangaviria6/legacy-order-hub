# Blueprint de Render: web service (Docker). La base de datos es externa (Supabase).
# CD: el despliegue lo dispara el workflow cd.yml de GitHub Actions mediante un
# Deploy Hook, solo cuando el CI pasa sobre main. Por eso el auto-deploy esta apagado.
services:
  - type: web
    name: legacy-order-hub
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthcheck
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: "8000"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Se escriben en el panel de Render (no se guardan en el repositorio).
      - key: DATABASE_URL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_USER_PASSWORD
        sync: false
